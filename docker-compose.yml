services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ch
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: olist
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: dev
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./data:/var/lib/clickhouse/user_files/olist
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
volumes:
  ch_data: